services:
  - type: web
    name: pm-kanban
    runtime: node
    plan: free
    buildCommand: apt-get install -y fonts-noto-core fonts-noto-extra chromium-browser 2>/dev/null; npm install; npx playwright install chromium --with-deps
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false

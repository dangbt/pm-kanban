services:
  - type: web
    name: pm-kanban
    runtime: node
    plan: free
    buildCommand: apt-get install -y fonts-noto-core fonts-noto-extra 2>/dev/null; npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
